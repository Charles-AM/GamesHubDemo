services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: arcadia
      POSTGRES_PASSWORD: arcadia
      POSTGRES_DB: arcadia
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcadia"]
      interval: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  migrate:
    build: {context: ., target: api}
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://arcadia:arcadia@postgres:5432/arcadia
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: ., target: api}
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://arcadia:arcadia@postgres:5432/arcadia
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-this-secret-before-deploying}
      WEB_ORIGIN: http://localhost:8080
      TRUST_PROXY: 1
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
  web:
    build: {context: ., target: web}
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
