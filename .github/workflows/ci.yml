name: Platform CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arcadia
          POSTGRES_PASSWORD: arcadia
          POSTGRES_DB: arcadia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arcadia" --health-interval 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://arcadia:arcadia@localhost:5432/arcadia
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      WEB_ORIGIN: http://localhost:5173
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
  # Configure Vercel and Railway Git integrations to deploy only after this required check.
  # No deployment credentials are stored in this repository.
